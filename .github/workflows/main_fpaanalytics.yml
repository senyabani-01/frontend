name: Build and Deploy to Azure - fpaanalytics

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies and Build
      working-directory: ./frontend
      run: |
        npm ci
        npm run build

    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v3
      with:
        app-name: 'fpaanalytics'
        slot-name: 'Production'
        package: ./frontend/dist  # <-- This is the key. Only deploy built files