<!DOCTYPE html>
<!-- Root HTML file. Vite injects the bundled JS into this page. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Makes the layout scale correctly on phones/tablets -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forest Park Academy | Student Portal</title>
    <!-- Google Fonts: a serif "display" face for headings (academic/crest feel)
         and a clean sans-serif for body text. Loaded once, globally. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- React mounts the entire app inside this single div -->
    <div id="root"></div>
    <!-- Load our JS entry point as an ES module -->
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
